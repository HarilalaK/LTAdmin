# Workflow GitHub Actions — à copier dans .github/workflows/tests.yml pour l’activer.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Bibliothèque standard uniquement (sqlite3, http.server) : aucune
      # dépendance à installer pour la suite de tests.
      - name: Lancer les tests
        run: python -m unittest discover -s tests -t . -v
