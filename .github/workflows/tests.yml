name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Aucun pyodbc : la suite utilise un moteur SQLite injectable, ce qui permet
      # de rejouer les tests sans Windows ni Microsoft Access Database Engine.
      - name: Lancer les tests
        run: python -m unittest discover -s tests -t . -v
