name: Build LTAdmin

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore LTAdmin.sln
      - name: Build
        run: dotnet build LTAdmin.sln --configuration Release --no-restore
